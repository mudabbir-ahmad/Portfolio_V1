# Container deployment:  docker compose up -d --build   (or: npm run docker)
#
# Inside the container the site reads ONLY the values below. secrets/ is never
# copied into the image (.dockerignore), so nothing personal lives in it.
# Running without Docker (npm run dev / npm start) reads secrets/.env instead.
#
# Edit the placeholders here, or keep this file generic and put your real
# values in a gitignored docker-compose.override.yml (compose merges it in
# automatically) or in a root .env file (compose substitutes ${VARS} from it).
services:
  portfolio:
    build: .
    image: portfolio
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Localhost only; put a TLS reverse proxy in front for public access.
      - "${BIND:-127.0.0.1}:${HOST_PORT:-3001}:3001"
    environment:
      VITE_NAME: "${VITE_NAME:-Your Name}"
      VITE_EMAIL: "${VITE_EMAIL:-}"            # empty hides the email button
      VITE_GITHUB_USER: "${VITE_GITHUB_USER:-your-github-username}"
      VITE_LINKEDIN: "${VITE_LINKEDIN:-}"      # empty hides the LinkedIn button
      VITE_UNIVERSITY: "${VITE_UNIVERSITY:-Your University}"
      VITE_CV_URL: "${VITE_CV_URL:-}"          # e.g. /CV/your-cv.pdf; empty hides CV buttons
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"        # read-only PAT; empty disables the contribution graph
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:3001}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
    # Only if you set VITE_CV_URL: the CV is never baked into the image.
    # volumes:
    #   - ./public/CV:/app/dist/CV:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
